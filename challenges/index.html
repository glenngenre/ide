<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- jQuery (needed by Semantic UI and Golden Layout) -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
            integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>

        <!-- KaTeX (math rendering) -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"
            integrity="sha512-LQNxIMR5rXv7o+b1l8+N1EZMfhG7iFZ9HhnbJkTp4zjNr5Wvst75AqUeFDxeRUa7l5vEDyUiAip//r+EFLLCyA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
            integrity="sha512-iWiuBS5nt6r60fCz26Nd0Zqe0nbk1ZTIQbl3Kv7kYsX+yKMUFHzjaH2+AnM6vp2Xs+gNmaBAVWJjSmuPw76Efg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"
            integrity="sha512-fHwaWebuwA7NSF5Qg/af4UeDx9XqUpYpOGgubo3yWu+b2IQR4UeQwbb42Ti7gVAjNtVoI/I9TEoYeu9omwcC6g=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- Golden Layout -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/golden-layout/1.5.9/goldenlayout.min.js"
            integrity="sha256-NhJAZDfGgv4PiB+GVlSrPdh3uc75XXYSM4su8hgTchI="
            crossorigin="anonymous"
        ></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/golden-layout/1.5.9/css/goldenlayout-base.css"
            integrity="sha512-rGtzJyDE8egZ/OScuBNLW1EIhRydcfrZo14oTvZwRLzEZu+s8foCtwi0XhXsKnhuoQAwJ7POFARWdU4fBL7FbQ=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <link
            id="judge0-golden-layout-dark-theme-stylesheet"
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/golden-layout/1.5.9/css/goldenlayout-dark-theme.css"
            integrity="sha512-XfcBrEH69BhsZ0XpvPyzOLgikhAvIG6Znbi6yKi1Jh1iYaOXSXvljWFerhcUl5LYLCuV61KhfCydQ1+MNxnilg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
            disabled
        />
        <link
            id="judge0-golden-layout-light-theme-stylesheet"
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/golden-layout/1.5.9/css/goldenlayout-light-theme.css"
            integrity="sha512-/S3N+v8cRHW2GJvM3v9FGHAKOhNgws+V1dYZb1fBxRd9XIwpqZFZB0jug+2HHf64eURsJLqVzCVn92pQTFHHow=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
            rel="stylesheet"
        />

        <!-- Semantic UI -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.css"
            integrity="sha512-KXol4x3sVoO+8ZsWPFI/r5KBVB/ssCGB5tsv2nVOKwLg33wTFP3fmnXa47FdSVIshVTgsYk/1734xSk9aFIa4A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.js"
            integrity="sha512-Xo0Jh8MsOn72LGV8kU5LsclG7SUzJsWGhXbWcYs2MAmChkQzwiW/yTQwdJ8w6UA9C6EVG18GHb/TrYpYCjyAQw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>

        <!-- Custom CSS -->
        <link type="text/css" rel="stylesheet" href="/css/ide.css" />
        <link type="text/css" rel="stylesheet" href="/css/semantic.css" />
        <link type="text/css" rel="stylesheet" href="/css/site.css" />
        <link type="text/css" rel="stylesheet" href="/css/challenges.css" />

        <script type="module" src="/js/challenges.js"></script>

        <title>Challenges · SKWTR IDE</title>

        <!-- Favicons -->
        <link rel="shortcut icon" href="/favicons/favicon.ico" />
        <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
        <link
            rel="icon"
            type="image/png"
            sizes="96x96"
            href="/favicons/favicon-96x96.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/favicons/favicon-180x180.png"
        />
        <meta name="apple-mobile-web-app-title" content="SKWTR IDE" />
        <link rel="manifest" href="/manifest.json" />
        <meta name="msapplication-TileColor" content="#ffffff" />
        <meta name="theme-color" content="#ffffff" />
    </head>

    <body>
        <div
            id="judge0-site-navigation"
            class="ui top fixed borderless menu judge0-showNavigation"
        >
            <a
                id="judge0-header"
                href="/"
                class="header item judge0-showLogo"
                title="Back to the IDE"
            >
                <img
                    id="judge0-logo"
                    src="/images/icon_var2_rounded_512.png"
                />
            </a>
            <a href="/" class="item" data-content="Back to the IDE">
                <i class="code icon"></i>
                IDE
            </a>
            <div class="item skwtr-nav-title">
                <i class="trophy icon"></i>
                Daily Challenge
            </div>
            <div id="skwtr-challenge-select-item" class="item judge0-hidden">
                <select
                    id="skwtr-challenge-select"
                    class="ui selection dropdown"
                    aria-label="Challenge"
                ></select>
            </div>
            <div class="item judge0-showSelectLanguage">
                <select
                    id="select-language"
                    class="ui search selection dropdown"
                    aria-label="Language"
                ></select>
            </div>
            <div class="item judge0-showRunButton">
                <button
                    id="skwtr-run-tests-btn"
                    class="ui primary labeled icon button"
                    data-content="+↵"
                >
                    <i class="tasks icon"></i>
                    Run Tests
                </button>
            </div>
            <div class="item">
                <button
                    id="skwtr-run-custom-btn"
                    class="ui labeled icon button"
                    data-content="Call your function with the arguments in the Custom Input tab"
                >
                    <i class="play icon"></i>
                    Run Custom
                </button>
            </div>
            <div class="item">
                <button
                    id="skwtr-reset-code-btn"
                    class="ui basic icon button"
                    data-content="Reset to the challenge's starting code"
                    aria-label="Reset to starting code"
                >
                    <i class="undo icon"></i>
                </button>
            </div>

            <div class="right menu">
                <div
                    id="judge0-save-status"
                    class="item judge0-save-status"
                    role="status"
                    aria-live="polite"
                >
                    Saved
                </div>
                <div
                    id="judge0-theme-toggle-btn"
                    class="icon link item judge0-showThemeButton"
                    data-content=""
                >
                    <i id="judge0-theme-toggle-btn-icon" class="sun icon"></i>
                </div>
            </div>
        </div>

        <div id="judge0-site-content"></div>

        <!-- Panels moved into the layout once it initialises -->
        <div hidden>
            <div id="skwtr-challenge-panel" class="skwtr-challenge-panel"></div>
            <div id="skwtr-tests-panel" class="skwtr-tests-panel"></div>
        </div>

        <!-- Login Modal -->
        <div id="skwtr-login-modal" class="ui tiny modal">
            <div class="header">Login to SKWTR IDE</div>
            <div class="content">
                <form id="login-form" class="ui form" autocomplete="off">
                    <div class="field">
                        <label>Username</label>
                        <div class="ui left icon input">
                            <input
                                type="text"
                                id="login-username"
                                name="username"
                                placeholder="Username"
                                required
                                autocomplete="username"
                            />
                            <i class="user icon"></i>
                        </div>
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <div class="ui left icon input">
                            <input
                                type="password"
                                id="login-password"
                                name="password"
                                placeholder="Password"
                                required
                                autocomplete="current-password"
                            />
                            <i class="lock icon"></i>
                        </div>
                    </div>
                    <div
                        class="ui error message"
                        id="login-error"
                        style="display: none"
                    ></div>
                    <button
                        class="ui fluid large primary submit button"
                        type="submit"
                    >
                        Login
                    </button>
                </form>
            </div>
        </div>

        <!-- Error Modal -->
        <div id="judge0-site-modal" class="ui modal">
            <div class="header">
                <span id="title"></span>
            </div>
            <div class="scrolling content"></div>
            <div class="actions">
                <a
                    id="report-problem-btn"
                    class="ui labeled icon red button"
                    href="https://github.com/glenngenre/ide/issues/new?title=New+bug+report&body=Describe+the+problem."
                    target="_blank"
                >
                    <i class="flag icon"></i>
                    Report Problem
                </a>
                <div class="ui labeled icon cancel secondary button">
                    <i class="close icon"></i>
                    Close (ESC)
                </div>
            </div>
        </div>

        <!-- Status Line -->
        <div
            id="judge0-status-line"
            class="ui bottom right attached mini label judge0-showStatusLine"
        ></div>

        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker
                    .register("/sw.js")
                    .then(() => console.log("Service Worker Registered"));
            }
        </script>
    </body>
</html>
